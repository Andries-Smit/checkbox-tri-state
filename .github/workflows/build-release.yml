name: Build, test and release with tag

on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    # - name: Use chrome driver
    #   uses: nanasess/setup-chromedriver@master

    # - name: Set chrome driver
    #   run: |
    #    echo "Check release   ${{ github.ref }} ${{ contains(github.ref, '/tags/') }}"
    #    export DISPLAY=:99
    #    chromedriver --url-base=/wd/hub &
    #    sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 & # optional

    - name: Use checkout
      uses: actions/checkout@v5

    - name: Use Node
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: npm

    - name: Read package info
      id: pkg
      run: |
        node -e '
          const p = require("./package.json");
          const mpk = `${p.packagePath}.${p.widgetName}.mpk`;
          console.log(`version=${p.version}`);
          console.log(`mpk=${mpk}`);
          console.log(`mpk_path=dist/${p.version}/${mpk}`);
        ' >> "$GITHUB_OUTPUT"

    - name: Echo widget and version
      run: echo "${{ steps.pkg.outputs.mpk }} @ ${{ steps.pkg.outputs.version }}"

    - name: Install Dependencies
      run: npm install

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Development build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: development_build
        path: ${{ steps.pkg.outputs.mpk_path }}

    # - name: Run unit test
    #   run: npm run test:unit

    # - name: Code coverage artifacts
    #   uses: actions/upload-artifact@v5
    #   with:
    #     name: coverage_report
    #     path: dist/coverage

    # - name: Run end 2 end test
    #   run: npm run test:e2e

    # - name: Screenshots E2E artifacts
    #   if: ${{ contains(github.ref, '/tags/') }}
    #   uses: actions/upload-artifact@v5
    #   with:
    #     name: e2e_screenshots_failed_test
    #     path: dist/e2e

    - name: Build release
      if: ${{ contains(github.ref, '/tags/') }}
      run: npm run release

    - name: Production build artifacts
      if: ${{ contains(github.ref, '/tags/') }}
      uses: actions/upload-artifact@v5
      with:
        name: production_build
        path: ${{ steps.pkg.outputs.mpk_path }}

    - name: Upload Release Asset
      if: ${{ contains(github.ref, '/tags/') }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.mpk_path }}" --clobber
